[project]
name = "argos"
version = "1.2.0"
description = "Veille et qualification d'appels d'offres multi-source"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "async>=0.6.2",
    "beautifulsoup4>=4.14.3",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "nicegui>=3.7.1",
    "openai>=2.18.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
