# Configuration uv pour les builds dans le reseau corporate Framatome.
#
# Utilisation recommandee :
#   uv --config-file uv-corporate.toml sync --group dev --locked
#
# `native-tls` force uv a utiliser le magasin de certificats Windows, ce qui
# permet de fonctionner avec l'inspection SSL corporate.

native-tls = true
index-url = "https://nexus.framatome.corp/repository/py-pypi/simple"
index-strategy = "first-index"
http-proxy = "http://163.116.128.80:8080"
https-proxy = "http://163.116.128.80:8080"
no-proxy = ["nexus.framatome.corp"]
